{{- define "acs.secretName" -}}
{{- .Values.acs.secrets.existingSecret | default "orc8r-acs-secrets" -}}
{{- end -}}
{{- if and .Values.acs.enabled (not .Values.acs.secrets.existingSecret) -}}
{{- $name := include "acs.secretName" . -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  annotations:
    # Losing the encryption key makes every stored ConnectionRequest password
    # unreadable, so the secret outlives the release and is reused on upgrade.
    helm.sh/resource-policy: keep
type: Opaque
data:
  ACS_BOOTSTRAP_USERNAME: {{ index $existing "ACS_BOOTSTRAP_USERNAME" | default (.Values.acs.secrets.bootstrapUsername | b64enc) }}
  ACS_BOOTSTRAP_PASSWORD: {{ index $existing "ACS_BOOTSTRAP_PASSWORD" | default (randAlphaNum 32 | b64enc) }}
  ACS_ENCRYPTION_KEY: {{ index $existing "ACS_ENCRYPTION_KEY" | default (randAlphaNum 32 | b64enc | b64enc) }}
{{- end -}}
