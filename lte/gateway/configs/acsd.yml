# log_level is set in mconfig. it can be overridden here

# CWMP (TR-069) listener for the CPEs behind this gateway. Every AGW has the
# same mtr0 address, so CPEs use one ACS URL: http://10.1.0.1:<cwmp_port>/
# 48080 is taken by enodebd. The mconfig port, when set, overrides this one.
cwmp_interface: mtr0
cwmp_address: 10.1.0.1
cwmp_port: 48081
# CPE connections served at once; further CPEs wait in the accept queue.
cwmp_workers: 16

# HTTP Digest authentication of CPEs, checked on top of the CPE identity
# (source IP -> IMSI). mode: required (default) or off. CPEs must be set with
# ManagementServer.Username/Password matching username/password below; with
# no credential set, every CPE is refused with 401. Never commit a password:
# set it in the gateway override /var/opt/magma/configs/acsd.yml, which
# replaces top-level keys, so copy the whole cwmp_auth section there.
cwmp_auth:
  mode: required
  realm: magma-acs
  username: ""
  password: ""
  # How long a Digest nonce is accepted; CPEs retry stale ones transparently.
  nonce_ttl_secs: 300

# Claimed mode: a second CWMP listener, HTTPS on the WAN side, for CPEs
# outside the Magma core (claimed by OUI/ProductClass/serial with
# acsd_cli.py). No IMSI lookup; Digest is always required: the bootstrap
# credential (cwmp_auth's unless set here) only until acsd rotates the CPE
# to its own. Off by default; the core listener above is unaffected.
cwmp_wan:
  enabled: false
  interface: eth0
  address: 0.0.0.0
  port: 48443
  cert_path: /var/opt/magma/certs/acsd_wan.crt
  key_path: /var/opt/magma/certs/acsd_wan.key

# Per-CPE radio KPIs (acs_rsrp_dbm, acs_rsrq_db, acs_sinr_db), labelled by
# cpe_key, for the online CPEs. Each CPE adds three series that metricsd
# pushes to Orc8r, so past max_cpes the rest are left out
# (acs_cpe_kpis_dropped counts them).
cpe_kpis:
  enabled: true
  max_cpes: 200
