---
swagger: '2.0'

info:
  title: acsd event definitions
  description: Events of the TR-069 ACS (acsd) about the CPEs it manages
  version: 1.0.0

definitions:
  cpe_session_completed:
    type: object
    description: A CWMP session of a CPE ended, whatever the result
    properties:
      cpe_key:
        type: string
        description: IMSI<digits> for a CPE on the core, a claim key otherwise
      imsi:
        type: string
        description: Empty when acsd does not know the CPE's IMSI
      session_id:
        type: string
      result:
        type: string
        enum:
          - completed
          - timed_out
          - interrupted
      reason:
        type: string
      started:
        type: number
        description: Unix time in seconds
      ended:
        type: number
        description: Unix time in seconds
      tasks_done:
        type: integer
      tasks_failed:
        type: integer
      faults:
        type: integer
        description: CWMP faults the CPE answered acsd requests with
  cpe_task_failed:
    type: object
    description: A task queued for a CPE failed for good (no retries left)
    properties:
      cpe_key:
        type: string
      imsi:
        type: string
      task_id:
        type: string
      task_type:
        type: string
      attempts:
        type: integer
      max_attempts:
        type: integer
      fault_code:
        type: integer
        description: 0 when the task failed because its sessions kept dropping
      fault_string:
        type: string
