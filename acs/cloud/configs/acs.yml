# The CPE list leaves out CPEs whose last Inform is older than this, unless
# asked for them (include_stale). Orc8r never deletes a cpe_acs row: acsd
# stops reporting a CPE silent for 7 days, and the cloud keeps its last
# report.
staleCpeAfterHours: 168
