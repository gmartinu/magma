---
swagger: '2.0'

magma-gen-meta:
  go-package: magma/acs/cloud/go/services/acs/obsidian/models
  dependencies:
    - 'orc8r/cloud/go/models/swagger-common.yml'
  temp-gen-filename: acs-swagger.yml
  output-dir: acs/cloud/go/services/acs/obsidian
  types:
    - go-struct-name: AcsCpe
      filename: acs_cpe_swaggergen.go
    - go-struct-name: AcsCpeDetail
      filename: acs_cpe_detail_swaggergen.go
    - go-struct-name: AcsCpeSession
      filename: acs_cpe_session_swaggergen.go
    - go-struct-name: AcsParameter
      filename: acs_parameter_swaggergen.go
    - go-struct-name: AcsParameterValue
      filename: acs_parameter_value_swaggergen.go
    - go-struct-name: AcsTaskRequest
      filename: acs_task_request_swaggergen.go
    - go-struct-name: AcsTask
      filename: acs_task_swaggergen.go
    - go-struct-name: AcsLog
      filename: acs_log_swaggergen.go
    - go-struct-name: AcsLogs
      filename: acs_logs_swaggergen.go

info:
  title: ACS
  description: TR-069 CPEs managed by the acsd service of each AGW
  version: 1.0.0

basePath: /magma/v1

tags:
  - name: ACS
    description: TR-069 CPEs of a network, as reported by its AGWs

paths:
  /acs/{network_id}/cpes:
    get:
      summary: List the CPEs the AGWs of the network report
      description: >
        Read from the cpe_acs state each AGW reports, so CPEs of an AGW that is
        offline still appear, with online false once the report is stale.
      tags:
        - ACS
      parameters:
        - $ref: './orc8r-swagger-common.yml#/parameters/network_id'
        - in: query
          name: model
          description: Only CPEs whose model_name or product_class is exactly this
          required: false
          type: string
        - in: query
          name: online
          description: Only CPEs that are (true) or are not (false) online
          required: false
          type: boolean
        - in: query
          name: gateway_id
          description: Only CPEs reported by this gateway
          required: false
          type: string
        - in: query
          name: mode
          description: Only CPEs of this identity mode
          required: false
          type: string
          enum:
            - core
            - claimed
      responses:
        '200':
          description: CPEs of the network, ordered by cpe_key
          schema:
            type: array
            items:
              $ref: '#/definitions/acs_cpe'
        default:
          $ref: './orc8r-swagger-common.yml#/responses/UnexpectedError'

  /acs/{network_id}/cpes/{cpe_key}:
    get:
      summary: Get a CPE with its normalized model
      description: From the reported state; works while the AGW is offline.
      tags:
        - ACS
      parameters:
        - $ref: './orc8r-swagger-common.yml#/parameters/network_id'
        - $ref: '#/parameters/acs_cpe_key'
      responses:
        '200':
          description: The CPE
          schema:
            $ref: '#/definitions/acs_cpe_detail'
        default:
          $ref: './orc8r-swagger-common.yml#/responses/UnexpectedError'

  /acs/{network_id}/cpes/{cpe_key}/parameters:
    get:
      summary: List the raw TR-069 parameters acsd last read from a CPE
      description: Read live from acsd on the CPE's AGW; 503 when the AGW is unreachable.
      tags:
        - ACS
      parameters:
        - $ref: './orc8r-swagger-common.yml#/parameters/network_id'
        - $ref: '#/parameters/acs_cpe_key'
        - in: query
          name: prefix
          description: Only parameters whose name starts with it, e.g. Device.Cellular.
          required: false
          type: string
      responses:
        '200':
          description: Parameters of the CPE, ordered by name
          schema:
            type: array
            items:
              $ref: '#/definitions/acs_parameter'
        default:
          $ref: './orc8r-swagger-common.yml#/responses/UnexpectedError'

  /acs/{network_id}/cpes/{cpe_key}/tasks:
    get:
      summary: List the tasks of a CPE in run order
      description: Read live from acsd on the CPE's AGW; 503 when the AGW is unreachable.
      tags:
        - ACS
      parameters:
        - $ref: './orc8r-swagger-common.yml#/parameters/network_id'
        - $ref: '#/parameters/acs_cpe_key'
      responses:
        '200':
          description: Tasks of the CPE
          schema:
            type: array
            items:
              $ref: '#/definitions/acs_task'
        default:
          $ref: './orc8r-swagger-common.yml#/responses/UnexpectedError'
    post:
      summary: Queue a task, run in the next CWMP session of the CPE
      description: >
        Relayed to acsd on the AGW that last reported the CPE. 400 for a
        malformed task, 404 for a CPE no AGW reports, 503 when the AGW is
        unreachable.
      tags:
        - ACS
      parameters:
        - $ref: './orc8r-swagger-common.yml#/parameters/network_id'
        - $ref: '#/parameters/acs_cpe_key'
        - in: body
          name: task
          required: true
          schema:
            $ref: '#/definitions/acs_task_request'
      responses:
        '201':
          description: The queued task
          schema:
            $ref: '#/definitions/acs_task'
        default:
          $ref: './orc8r-swagger-common.yml#/responses/UnexpectedError'

  /acs/{network_id}/cpes/{cpe_key}/tasks/{task_id}:
    get:
      summary: Get a task of a CPE
      tags:
        - ACS
      parameters:
        - $ref: './orc8r-swagger-common.yml#/parameters/network_id'
        - $ref: '#/parameters/acs_cpe_key'
        - in: path
          name: task_id
          description: Task ID returned when the task was queued
          required: true
          type: string
      responses:
        '200':
          description: The task
          schema:
            $ref: '#/definitions/acs_task'
        default:
          $ref: './orc8r-swagger-common.yml#/responses/UnexpectedError'

  /acs/{network_id}/logs:
    get:
      summary: Search the session log of the network's CPEs
      description: >
        The events acsd sends to eventd (one cpe_session_completed per CWMP
        session, one cpe_task_failed per task out of retries), newest first,
        as fluentd indexed them into the eventd-* Elasticsearch indices. Kept
        for the Elasticsearch retention.
      tags:
        - ACS
      parameters:
        - $ref: './orc8r-swagger-common.yml#/parameters/network_id'
        - in: query
          name: cpe_key
          description: Only records of this CPE
          required: false
          type: string
        - in: query
          name: gateway_id
          description: Only records sent by this gateway
          required: false
          type: string
        - in: query
          name: event
          description: Only records of this event
          required: false
          type: string
          enum:
            - cpe_session_completed
            - cpe_task_failed
        - in: query
          name: start
          description: Only records at or after this time (RFC 3339)
          required: false
          type: string
          format: date-time
        - in: query
          name: end
          description: Only records at or before this time (RFC 3339)
          required: false
          type: string
          format: date-time
        - in: query
          name: size
          description: Records per page (1-1000, default 100)
          required: false
          type: integer
          minimum: 1
          maximum: 1000
        - in: query
          name: from
          description: Records to skip, for the next pages
          required: false
          type: integer
          minimum: 0
      responses:
        '200':
          description: A page of records
          schema:
            $ref: '#/definitions/acs_logs'
        default:
          $ref: './orc8r-swagger-common.yml#/responses/UnexpectedError'

parameters:
  acs_cpe_key:
    in: path
    name: cpe_key
    description: >
      acsd's key of the CPE: IMSI<digits> for a CPE on the Magma core,
      CLAIM<id> for a claimed CPE
    required: true
    type: string

definitions:
  acs_cpe:
    description: A TR-069 CPE as last reported by its AGW
    type: object
    x-nullable: false
    required:
      - cpe_key
      - mode
      - online
      - gateway_id
      - reported_at
    properties:
      cpe_key:
        x-nullable: false
        type: string
        minLength: 1
        example: IMSI001010000000001
      mode:
        x-nullable: false
        type: string
        enum:
          - core
          - claimed
      imsi:
        description: Empty when unknown (a claimed CPE that did not report its SIM)
        type: string
        example: IMSI001010000000001
      serial_number:
        type: string
        example: ABC123456
      oui:
        type: string
        example: 00259E
      product_class:
        type: string
        example: Titan4000
      model_name:
        description: ModelName the CPE reported, from the normalized model
        type: string
      software_version:
        type: string
      handler:
        description: Datamodel handler acsd serves the CPE with
        type: string
      last_inform:
        description: When the CPE last sent an Inform; absent if never
        x-nullable: true
        type: string
        format: date-time
      informs_total:
        type: integer
        format: int64
      online:
        description: >
          Whether the last Inform is at most two periodic inform intervals old,
          as acsd computed it; false when the AGW report is stale
        x-nullable: false
        type: boolean
      pending_tasks:
        type: integer
        format: int32
      last_session:
        $ref: '#/definitions/acs_cpe_session'
      gateway_id:
        description: Gateway whose acsd last reported the CPE; empty if unregistered
        x-nullable: false
        type: string
      hardware_id:
        description: Hardware ID of that gateway
        type: string
      reported_at:
        description: When the AGW last reported the CPE's state
        x-nullable: false
        type: string
        format: date-time

  acs_cpe_session:
    description: How the last CWMP session of a CPE ended
    type: object
    properties:
      session_id:
        type: string
      result:
        description: completed, timed_out or interrupted
        type: string
      reason:
        type: string
      started:
        x-nullable: true
        type: string
        format: date-time
      ended:
        x-nullable: true
        type: string
        format: date-time
      tasks_done:
        type: integer
        format: int32
      tasks_failed:
        type: integer
        format: int32
      faults:
        type: integer
        format: int32

  acs_cpe_detail:
    description: A CPE with its normalized model
    type: object
    x-nullable: false
    required:
      - cpe
    properties:
      cpe:
        $ref: '#/definitions/acs_cpe'
      model:
        description: >
          Vendor-independent model of the CPE (identity, cellular, wan,
          management_server, ...)
        type: object

  acs_parameter:
    description: A raw TR-069 parameter as acsd last read it
    type: object
    x-nullable: false
    required:
      - name
      - value
    properties:
      name:
        x-nullable: false
        type: string
        example: Device.Cellular.Interface.1.RSRP
      value:
        x-nullable: false
        type: string
        example: '-95'

  acs_parameter_value:
    description: A TR-069 parameter and the value to set
    type: object
    x-nullable: false
    required:
      - name
      - value
    properties:
      name:
        x-nullable: false
        type: string
        minLength: 1
        example: Device.ManagementServer.PeriodicInformInterval
      value:
        x-nullable: false
        type: string
        example: '300'
      type:
        description: xsd type of the value, xsd:string when empty
        type: string
        example: xsd:unsignedInt

  acs_task_request:
    description: An operation to run on a CPE in its next session
    type: object
    required:
      - type
    properties:
      type:
        x-nullable: false
        type: string
        enum:
          - reboot
          - factory_reset
          - refresh
          - get_parameter_values
          - set_parameter_values
          - get_parameter_names
      parameter_names:
        description: Parameters or partial paths to read (get_parameter_values)
        type: array
        items:
          type: string
      parameter_values:
        description: Values to set (set_parameter_values)
        type: array
        items:
          $ref: '#/definitions/acs_parameter_value'
      parameter_path:
        description: Path to list (get_parameter_names)
        type: string
      next_level:
        description: List only the direct children of parameter_path
        type: boolean
      max_attempts:
        description: Sessions the task may be tried in; acsd's default when 0
        type: integer
        format: int32
        minimum: 0
      ttl_sec:
        description: >
          Seconds after which a task not yet run expires; acsd's default when
          0, never when negative
        type: integer
        format: int64

  acs_task:
    description: An operation queued for a CPE
    type: object
    x-nullable: false
    required:
      - id
      - cpe_key
      - type
      - status
      - attempts
      - max_attempts
      - created
      - updated
    properties:
      id:
        x-nullable: false
        type: string
      cpe_key:
        x-nullable: false
        type: string
      type:
        x-nullable: false
        type: string
        enum:
          - reboot
          - factory_reset
          - refresh
          - get_parameter_values
          - set_parameter_values
          - get_parameter_names
      status:
        x-nullable: false
        type: string
        enum:
          - pending
          - in_progress
          - done
          - failed
          - expired
      args:
        description: The arguments the task was queued with
        type: object
      attempts:
        x-nullable: false
        type: integer
        format: int32
      max_attempts:
        x-nullable: false
        type: integer
        format: int32
      result:
        description: What the CPE answered (values, names) and faults the task tolerated
        type: object
      fault_code:
        description: CWMP fault code of the last fault; 0 for a requeue after a dropped session
        type: integer
        format: int32
      fault_string:
        type: string
      created:
        x-nullable: false
        type: string
        format: date-time
      updated:
        x-nullable: false
        type: string
        format: date-time
      deadline:
        description: When a task not yet run expires; absent if never
        x-nullable: true
        type: string
        format: date-time
      imsi:
        type: string

  acs_logs:
    description: A page of session log records
    type: object
    required:
      - total_count
      - logs
    properties:
      total_count:
        description: Records matching the query, on every page
        x-nullable: false
        type: integer
        format: int64
      logs:
        type: array
        items:
          $ref: '#/definitions/acs_log'

  acs_log:
    description: >
      One acsd event. Session fields are set on cpe_session_completed, task
      fields on cpe_task_failed (lte/swagger/cpe_acs_events.v1.yml).
    type: object
    required:
      - time
      - event
      - cpe_key
    properties:
      time:
        description: When eventd received the event
        x-nullable: false
        type: string
        format: date-time
      event:
        x-nullable: false
        type: string
        enum:
          - cpe_session_completed
          - cpe_task_failed
      cpe_key:
        x-nullable: false
        type: string
      imsi:
        description: Empty when acsd does not know the CPE's IMSI
        type: string
      gateway_id:
        type: string
      hardware_id:
        type: string
      session_id:
        type: string
      result:
        description: completed, timed_out or interrupted
        type: string
      reason:
        type: string
      started:
        x-nullable: true
        type: string
        format: date-time
      ended:
        x-nullable: true
        type: string
        format: date-time
      tasks_done:
        type: integer
        format: int32
      tasks_failed:
        type: integer
        format: int32
      faults:
        type: integer
        format: int32
      task_id:
        type: string
      task_type:
        type: string
      attempts:
        type: integer
        format: int32
      max_attempts:
        type: integer
        format: int32
      fault_code:
        description: 0 when the task failed because its sessions kept dropping
        type: integer
        format: int32
      fault_string:
        type: string
