---
swagger: '2.0'

magma-gen-meta:
  go-package: magma/acs/cloud/go/services/acs/obsidian/models
  dependencies:
    - 'orc8r/cloud/go/models/swagger-common.yml'
  temp-gen-filename: acs-swagger.yml
  output-dir: acs/cloud/go/services/acs/obsidian
  types:
    - go-struct-name: AcsDevice
      filename: acs_device_swaggergen.go
    - go-struct-name: AcsTask
      filename: acs_task_swaggergen.go
    - go-struct-name: AcsTaskRequest
      filename: acs_task_request_swaggergen.go
    - go-struct-name: AcsParameterValue
      filename: acs_parameter_value_swaggergen.go
    - go-struct-name: AcsDeviceDetail
      filename: acs_device_detail_swaggergen.go
    - go-struct-name: AcsInform
      filename: acs_inform_swaggergen.go
    - go-struct-name: AcsParameter
      filename: acs_parameter_swaggergen.go
    - go-struct-name: AcsSessionLog
      filename: acs_session_log_swaggergen.go
    - go-struct-name: AcsSessionLogs
      filename: acs_session_logs_swaggergen.go

info:
  title: ACS
  description: TR-069 Auto Configuration Server REST APIs
  version: 1.0.0

basePath: /magma/v1

tags:
  - name: ACS
    description: Endpoints related to TR-069 CPEs managed by the ACS

paths:
  /acs/unclaimed:
    get:
      summary: List the CPEs no network has claimed
      description: >
        CPEs that reached the ACS but belong to no network yet. They are not
        scoped to a tenant, so this needs access to every network; tenants
        claim a CPE by its device ID instead. Unclaimed CPEs can only be
        listed: they have no detail, parameters or tasks until claimed.
      tags:
        - ACS
      parameters:
        - $ref: '#/parameters/acs_model'
        - $ref: '#/parameters/acs_online'
      responses:
        '200':
          description: Unclaimed CPEs
          schema:
            type: array
            items:
              $ref: '#/definitions/acs_device'
        default:
          $ref: './orc8r-swagger-common.yml#/responses/UnexpectedError'

  /acs/{network_id}/devices:
    get:
      summary: List the CPEs claimed by the network
      tags:
        - ACS
      parameters:
        - $ref: './orc8r-swagger-common.yml#/parameters/network_id'
        - $ref: '#/parameters/acs_model'
        - $ref: '#/parameters/acs_online'
      responses:
        '200':
          description: CPEs claimed by the network
          schema:
            type: array
            items:
              $ref: '#/definitions/acs_device'
        default:
          $ref: './orc8r-swagger-common.yml#/responses/UnexpectedError'

  /acs/{network_id}/devices/{device_id}:
    get:
      summary: Get a CPE with its last Inform and normalized state
      tags:
        - ACS
      parameters:
        - $ref: './orc8r-swagger-common.yml#/parameters/network_id'
        - $ref: '#/parameters/acs_device_id'
      responses:
        '200':
          description: The CPE
          schema:
            $ref: '#/definitions/acs_device_detail'
        default:
          $ref: './orc8r-swagger-common.yml#/responses/UnexpectedError'

  /acs/{network_id}/devices/{device_id}/claim:
    post:
      summary: Claim an unclaimed CPE for the network
      description: >
        Fails with 404 for a CPE the ACS has not seen and 409 for one another
        network, or this one, already claimed.
      tags:
        - ACS
      parameters:
        - $ref: './orc8r-swagger-common.yml#/parameters/network_id'
        - $ref: '#/parameters/acs_device_id'
      responses:
        '200':
          description: The claimed CPE
          schema:
            $ref: '#/definitions/acs_device'
        default:
          $ref: './orc8r-swagger-common.yml#/responses/UnexpectedError'

  /acs/{network_id}/devices/{device_id}/parameters:
    get:
      summary: List the raw TR-069 parameters last read from a CPE
      description: >
        Values from Informs and from refresh and get_parameter_values tasks,
        each with when it was last read, ordered by name.
      tags:
        - ACS
      parameters:
        - $ref: './orc8r-swagger-common.yml#/parameters/network_id'
        - $ref: '#/parameters/acs_device_id'
        - in: query
          name: prefix
          description: Only parameters whose name starts with it, e.g. Device.Cellular.
          required: false
          type: string
      responses:
        '200':
          description: Parameters of the CPE
          schema:
            type: array
            items:
              $ref: '#/definitions/acs_parameter'
        default:
          $ref: './orc8r-swagger-common.yml#/responses/UnexpectedError'

  /acs/{network_id}/devices/{device_id}/tasks:
    get:
      summary: List the tasks of a CPE, oldest first, as its task history
      tags:
        - ACS
      parameters:
        - $ref: './orc8r-swagger-common.yml#/parameters/network_id'
        - $ref: '#/parameters/acs_device_id'
      responses:
        '200':
          description: Tasks of the CPE
          schema:
            type: array
            items:
              $ref: '#/definitions/acs_task'
        default:
          $ref: './orc8r-swagger-common.yml#/responses/UnexpectedError'
    post:
      summary: Queue a task, executed in the next session of the CPE
      tags:
        - ACS
      parameters:
        - $ref: './orc8r-swagger-common.yml#/parameters/network_id'
        - $ref: '#/parameters/acs_device_id'
        - in: body
          name: task
          required: true
          schema:
            $ref: '#/definitions/acs_task_request'
      responses:
        '201':
          description: The queued task
          schema:
            $ref: '#/definitions/acs_task'
        default:
          $ref: './orc8r-swagger-common.yml#/responses/UnexpectedError'

  /acs/{network_id}/devices/{device_id}/tasks/{task_id}:
    get:
      summary: Get a task of a CPE
      tags:
        - ACS
      parameters:
        - $ref: './orc8r-swagger-common.yml#/parameters/network_id'
        - $ref: '#/parameters/acs_device_id'
        - $ref: '#/parameters/acs_task_id'
      responses:
        '200':
          description: The task
          schema:
            $ref: '#/definitions/acs_task'
        default:
          $ref: './orc8r-swagger-common.yml#/responses/UnexpectedError'

  /acs/{network_id}/logs:
    get:
      summary: Search the CWMP session logs of a network
      description: >
        One record per CWMP exchange of the network's CPEs (Inform, each RPC,
        session end, auth failure, rate limit), newest first, from the acs-*
        Elasticsearch indices. Records of a CPE before it was claimed carry no
        network and are not listed. Indices are kept for the Elasticsearch
        retention (7 days by default).
      tags:
        - ACS
      parameters:
        - $ref: './orc8r-swagger-common.yml#/parameters/network_id'
        - in: query
          name: device_id
          description: Only records of this CPE (OUI-ProductClass-SerialNumber)
          required: false
          type: string
        - in: query
          name: begin
          description: Only records at or after this time (RFC 3339)
          required: false
          type: string
          format: date-time
        - in: query
          name: end
          description: Only records at or before this time (RFC 3339)
          required: false
          type: string
          format: date-time
        - in: query
          name: size
          description: Maximum number of records returned (1-1000, default 50)
          required: false
          type: integer
          minimum: 1
          maximum: 1000
      responses:
        '200':
          description: Session log records
          schema:
            $ref: '#/definitions/acs_session_logs'
        default:
          $ref: './orc8r-swagger-common.yml#/responses/UnexpectedError'

parameters:
  acs_device_id:
    in: path
    name: device_id
    description: TR-069 DeviceId as OUI-ProductClass-SerialNumber
    required: true
    type: string
  acs_model:
    in: query
    name: model
    description: Only CPEs reporting exactly this model name
    required: false
    type: string
  acs_online:
    in: query
    name: online
    description: Only CPEs that are (true) or are not (false) online
    required: false
    type: boolean
  acs_task_id:
    in: path
    name: task_id
    description: Task ID
    required: true
    type: string

definitions:
  acs_device:
    description: A TR-069 CPE known to the ACS
    type: object
    x-nullable: false
    required:
      - device_id
      - oui
      - serial_number
      - first_seen
      - last_seen
      - online
    properties:
      device_id:
        x-nullable: false
        description: TR-069 DeviceId as OUI-ProductClass-SerialNumber
        type: string
        minLength: 1
        example: 00259E-Titan4000-ABC123456
      oui:
        x-nullable: false
        type: string
        example: 00259E
      product_class:
        type: string
        example: Titan4000
      serial_number:
        x-nullable: false
        type: string
        example: ABC123456
      model:
        type: string
      firmware:
        description: Software version reported by the CPE
        type: string
      handler:
        description: Model handler the ACS uses for this CPE
        type: string
      first_seen:
        x-nullable: false
        type: string
        format: date-time
      last_seen:
        description: When the CPE last sent an Inform
        x-nullable: false
        type: string
        format: date-time
      online:
        description: >
          Whether the last Inform is at most online_interval_multiple periodic
          inform intervals old (the service config; 2 by default, with
          online_default_interval_sec standing in for an unknown interval)
        x-nullable: false
        type: boolean
      periodic_inform_interval:
        description: PeriodicInformInterval in seconds the CPE last reported; absent while unknown
        type: integer
        format: int64

  acs_inform:
    description: The last Inform of a CPE
    type: object
    x-nullable: false
    required:
      - time
      - events
    properties:
      time:
        x-nullable: false
        type: string
        format: date-time
      events:
        description: Event codes, e.g. 2 PERIODIC
        type: array
        items:
          type: string

  acs_device_detail:
    description: A CPE with its last Inform and normalized state
    type: object
    x-nullable: false
    required:
      - device
      - last_inform
    properties:
      device:
        $ref: '#/definitions/acs_device'
      last_inform:
        $ref: '#/definitions/acs_inform'
      state:
        description: Vendor-independent model of the CPE (identity, firmware, cellular KPIs, WAN, management server)
        type: object
      state_updated:
        description: When the state last changed; absent without state
        x-nullable: true
        type: string
        format: date-time

  acs_parameter:
    description: A raw TR-069 parameter as last read from the CPE
    type: object
    x-nullable: false
    required:
      - name
      - value
      - updated
    properties:
      name:
        x-nullable: false
        type: string
        example: Device.Cellular.Interface.1.RSRP
      value:
        x-nullable: false
        type: string
        example: '-95'
      updated:
        x-nullable: false
        type: string
        format: date-time

  acs_parameter_value:
    description: A TR-069 parameter and its value
    type: object
    x-nullable: false
    required:
      - name
      - value
    properties:
      name:
        x-nullable: false
        type: string
        minLength: 1
        example: Device.ManagementServer.PeriodicInformInterval
      value:
        x-nullable: false
        type: string
        example: '300'
      type:
        description: xsi:type of the value, xsd:string when empty
        type: string
        example: xsd:unsignedInt

  acs_task_request:
    description: An operation to run on a CPE in its next session
    type: object
    required:
      - type
    properties:
      type:
        x-nullable: false
        type: string
        enum:
          - reboot
          - factory_reset
          - refresh
          - get_parameter_values
          - set_parameter_values
          - get_parameter_names
      parameter_names:
        description: Parameters or partial paths to read (get_parameter_values)
        type: array
        items:
          type: string
      parameter_values:
        description: Values to set (set_parameter_values)
        type: array
        items:
          $ref: '#/definitions/acs_parameter_value'
      parameter_path:
        description: Path to list (get_parameter_names); the data model root when empty
        type: string
      next_level:
        description: List only the direct children of parameter_path
        type: boolean
      max_attempts:
        description: Sessions the task may be tried in; the service default when 0
        type: integer
        minimum: 0
      ttl_sec:
        description: Seconds after which a task not yet run expires; the service default when 0
        type: integer
        minimum: 0

  acs_task:
    description: An operation queued for a CPE
    type: object
    x-nullable: false
    required:
      - id
      - device_id
      - type
      - status
      - attempts
      - max_attempts
      - created
      - updated
    properties:
      id:
        x-nullable: false
        type: string
      device_id:
        x-nullable: false
        type: string
      type:
        x-nullable: false
        type: string
      status:
        x-nullable: false
        type: string
        enum:
          - pending
          - in_progress
          - done
          - failed
          - expired
      attempts:
        x-nullable: false
        type: integer
      max_attempts:
        x-nullable: false
        type: integer
      parameter_names:
        type: array
        items:
          type: string
      parameter_values:
        type: array
        items:
          $ref: '#/definitions/acs_parameter_value'
      parameter_path:
        type: string
      next_level:
        type: boolean
      result:
        description: What the CPE returned (values, names, status) and faults the task tolerated
        type: object
      fault_code:
        description: CWMP fault code of the last failed attempt
        type: integer
      fault_string:
        type: string
      created:
        x-nullable: false
        type: string
        format: date-time
      updated:
        x-nullable: false
        type: string
        format: date-time
      deadline:
        type: string
        format: date-time

  acs_session_logs:
    description: A page of session log records
    type: object
    x-nullable: false
    required:
      - total_count
      - logs
    properties:
      total_count:
        description: Records matching the query, beyond the page size
        type: integer
        format: int64
      logs:
        type: array
        items:
          $ref: '#/definitions/acs_session_log'

  acs_session_log:
    description: One CWMP exchange of a CPE
    type: object
    x-nullable: false
    required:
      - time
      - event
    properties:
      time:
        type: string
        format: date-time
      event:
        type: string
        enum:
          - inform
          - rpc
          - session_end
          - auth_failure
          - rate_limited
      device_id:
        type: string
      network_id:
        type: string
      session_id:
        type: string
      source_ip:
        type: string
      event_codes:
        description: Inform event codes, e.g. 2 PERIODIC
        type: array
        items:
          type: string
      handler:
        description: Data model handler serving the CPE
        type: string
      bootstrap:
        description: The session authenticated with the bootstrap credentials
        type: boolean
      rpc:
        description: The CPE request, or the ACS request the CPE answered
        type: string
      task_id:
        type: string
      task_type:
        type: string
      fault_code:
        type: integer
      fault_string:
        type: string
      reason:
        description: Why the request was refused
        type: string
      duration_ms:
        description: Time the ACS took to handle the request
        type: integer
        format: int64
      session_duration_sec:
        description: Length of the session, on session_end
        type: integer
        format: int64
      rpc_count:
        description: ACS requests sent in the session, on session_end
        type: integer
